vllm = [
    "fastapi<0.137; sys_platform == 'linux'",
    "setuptools>=77.0.3,<80",
    "torch==2.8.0; sys_platform == 'linux'",
    "vllm>=0.10.2,<0.11.1; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [
    [
        { extra = "ag2" },
        { extra = "magentic-one" },
    ],
    [
        { extra = "ag2" },
        { extra = "metagpt" },
    ],
    [
        { extra = "ag2" },
        { extra = "openmanus" },
    ],
    [
        { extra = "magentic-one" },
        { extra = "openmanus" },
    ],
]

[dependency-groups]
dev = [
    "pydantic>=2,<3",
    "pytest~=8.3.5",
    "pytest-asyncio~=0.25.3",
]

[project.scripts]
masfm = "masfm.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["aria", "common", "inference", "masfm", "repair"]
