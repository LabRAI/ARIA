[project]
name = "masfm"
version = "0.1.0"
description = "ARIA: A Runtime Inspection and Patching Framework for Multi-Agent Systems"
requires-python = ">=3.11"
dependencies = [
    "antlr4-python3-runtime==4.11.*",
    "huggingface-hub>=0.34,<1",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1,<4",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1.5,<4",
    "partial-json-parser>=0.2.1.1.post7,<0.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "socksio>=1.0.0",
    "swebench==4.1.0",
    "sympy>=1.13,<2",
    "tenacity~=9.0.0",
    "tqdm>=4.67.1",
]

