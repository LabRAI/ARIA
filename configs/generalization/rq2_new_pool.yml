job: aria-generalization
runtime:
  kind: endpoint
data_dir: data
external_dir: external
output_dir: outputs/training/rq2/pool
workspace_dir: workspace
output:
  existing_output_policy: resume
logging:
  level: INFO
prepare:
  clone_mas: false
  download_benchmarks: true
api:
  provider: vllm
  protocol: openai-chat-completions
  base_url: http://127.0.0.1:18900/v1
  model: Qwen/Qwen3-8B
  api_key_env: HOST_API_KEY
  api_key_required: false
  timeout_seconds: 300
  max_tokens: 2048
  context_window_tokens: 32768
  temperature: 0.0
  seed: 42
  retries: 2
  retry_seconds: 2
aria:
  enabled: true
  mode: active
  fail_open: true
  gate_threshold: 0.6
  model:
    provider: openai-chat-completions
    model: rq2-new-pool-only
    base_url: http://127.0.0.1:18200/v1
    api_key_env: ARIA_API_KEY
    api_key_required: false
    max_tokens: 2048
    max_input_tokens: 6144
    tokenizer_endpoint: http://127.0.0.1:18200/tokenize
    temperature: 0.0
    seed: 42
    runtime_context: true
    gate_probability_source: label_likelihood
    structured_output_retries: 1
generalization:
  fitting_paths:
  - outputs/training/rq2/views/fitting_audit.jsonl
  seen_host_models:
  - Llama-3.1-70B-Instruct
  - Qwen3-32B
  - Qwen3-8B
  - endpoint-a-gpt-5-5-high
  - endpoint-a-gpt-5-5-medium
  - endpoint-a-gpt-5-5-xhigh
  - claude-opus-4-8
  - claude-sonnet-4-6
  - gpt-5.5
  - gpt55-high
  - gpt55-medium
  - gpt55-xhigh
  - llama31-70b
  - llama31-70b-full-staged
  - qwen3-32b-nonthinking
  - qwen3-8b-nonthinking
  prepare_only: true
  seed: 42
  project_environments:
    ag2: .venv-ag2
    langgraph: .venv-langgraph
experiments:
- name: reference-ag2-gsm
  generalization_axis: reference
  mas: ag2
  benchmark: gsm-plus
  native: true
  batch: true
  sample_source: full
  sample_split: test
  sample_limit: 100
  max_turns: 4
  native_timeout_seconds: 1800
- name: ood-ag2-bbh
  generalization_axis: unseen_benchmark
  mas: ag2
  benchmark: bbh
  native: true
  batch: true
  sample_source: full
  sample_split: test
  sample_limit: 108
  max_turns: 4
  native_timeout_seconds: 1800
- name: ood-ag2-arc
  generalization_axis: unseen_benchmark
  mas: ag2
  benchmark: arc-challenge
  native: true
  batch: true
  sample_source: full
  sample_split: test
  sample_limit: 100
  max_turns: 4
  native_timeout_seconds: 1800
- name: unseen-system-langgraph-gsm
  generalization_axis: unseen_system
  mas: langgraph
  benchmark: gsm-plus
  native: true
  batch: true
  sample_source: full
  sample_split: test
  sample_limit: 100
  max_turns: 2
  native_timeout_seconds: 1800
